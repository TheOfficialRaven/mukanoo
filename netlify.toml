[build]
  publish = "."
  command = "node scripts/build.mjs"
  functions = "netlify/functions"

  # CONTACT_FROM / CONTACT_TO publikus elérhetőségek (szerepelnek a HTML-ben is),
  # ne bukjon el a secrets scan miatt. A RESEND_API_KEY továbbra is védve van.
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "CONTACT_FROM,CONTACT_TO"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# A build tartalom-hash-t tesz a ?v= paraméterbe, így ezek nyugodtan cache-elhetők sokáig
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
